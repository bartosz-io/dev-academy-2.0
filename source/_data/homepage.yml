security_pill:
  label: Security Tuesday
  reading_time: 3 min read
  subject: Can another website click your buttons?
  greeting: Hi developer,
  intro: Imagine a user visits an attacker-controlled page while signed in to your application. The attacker places your app inside a transparent iframe over a harmless-looking button.
  problem_label: The click lands inside your application
  problem: If the framed page has an authenticated session, the browser delivers the user's click to the real button inside your app.
  problem_code: |
    <iframe src="https://your-app.com/account"
            class="invisible-overlay"></iframe>
  problem_code_language: html
  bullets:
    - The user sees the attacker's interface, not the framed page.
    - The click can trigger a real state-changing action in your app.
    - Authentication alone does not prove that the user intended the action.
  solution_label: Control who can frame your application
  solution: Return a Content Security Policy header with frame-ancestors. Use 'none' when your application should never be embedded.
  solution_code: |
    Content-Security-Policy: frame-ancestors 'none';
  solution_code_language: plaintext
  takeaway: The browser now refuses to render your application inside an attacker-controlled frame, preventing the clickjacking setup.
  signoff: Stay curious, Bartosz

security_pill_2:
  label: Security Email #2
  reading_time: 3 min read
  subject: Would this malicious URL pass your allow-list?
  greeting: Hi developer,
  intro: Imagine an agent opens a pull request containing this URL allow-list. The intention is to accept URLs from safe-app.com and reject everything else.
  problem_label: This check trusts a string prefix
  problem: An attacker can put the trusted text at the beginning of a hostname they control, and this validator will accept it.
  problem_code: |
    value.startsWith('https://safe-app.com')
  problem_code_language: javascript
  bullets:
    - https://safe-app.com.evil.com passes the string check.
    - String methods do not understand URL or hostname boundaries.
  solution_label: Parse the URL and compare its exact origin
  solution: Let the URL parser identify the scheme, hostname, and port, then compare the complete origin your application trusts.
  solution_code: |
    const origin = new URL(value).origin;
    const trusted = origin === 'https://safe-app.com';
  solution_code_language: javascript
  takeaway: AI can generate a validator that looks reasonable. Your review still has to verify whether it enforces the real security boundary.
  signoff: See you next Tuesday, Bartosz

ai:
  eyebrow: Why this matters now
  title: Code gets produced faster. Judgment doesn't.
  body: AI can generate features and security fixes. You still need to recognize broken trust boundaries, missing authorization, unsafe input handling, exposed secrets, and fixes that protect the wrong thing.
  takeaway: Dev Academy trains the security judgment behind the code — one focused email at a time.

