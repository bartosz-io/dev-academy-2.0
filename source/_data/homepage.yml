security_pill:
  label: Security Tuesday
  reading_time: 3 min read
  subject: Can another website click your buttons?
  greeting: Hi developer,
  intro: Imagine a user visits an attacker-controlled page while signed in to your application. The attacker places your app inside a transparent iframe over a harmless-looking button.
  problem_label: The click lands inside your application
  problem: If the framed page has an authenticated session, the browser delivers the user's click to the real button inside your app.
  problem_code: |
    <iframe src="https://your-app.com/account"
            class="invisible-overlay"></iframe>
  bullets:
    - The user sees the attacker's interface, not the framed page.
    - The click can trigger a real state-changing action in your app.
    - Authentication alone does not prove that the user intended the action.
  solution_label: Control who can frame your application
  solution: Return a Content Security Policy header with frame-ancestors. Use 'none' when your application should never be embedded.
  solution_code: |
    Content-Security-Policy: frame-ancestors 'none';
  takeaway: The browser now refuses to render your application inside an attacker-controlled frame, preventing the clickjacking setup.
  signoff: Stay curious, Bartosz

testing_pill:
  label: Testing Friday
  reading_time: 4 min read
  subject: How to test ARCHITECTURE?
  greeting: Hi developer,
  intro: In a layered application, controllers should depend on services and services should depend on repositories.
  problem_label: Architecture deteriorates silently
  problem: Without an automated boundary, a clean dependency graph can slowly become a big ball of mud.
  problem_code: |
    controllers -> services -> repositories
  bullets:
    - A controller imports an API file directly.
    - Reviewers miss the dependency in a large pull request.
    - The exception becomes the next developer's precedent.
  solution_label: Restrict the dependencies with testing
  solution: In TypeScript, TSArch can fail the build when a controller crosses the boundary.
  solution_code: |
    describe("Application", () => {
      it("controllers should not depend on APIs", async () => {
        const rule = filesOfProject()
          .matchingPattern(".*controller\\.ts")
          .shouldNot()
          .dependOnFiles()
          .matchingPattern(".*api\\.ts");

        await expect(rule).toPassAsync();
      });
    });
  takeaway: The test turns an architectural intention into an executable rule.
  signoff: See you next Friday, Bartosz

ai:
  eyebrow: Why this matters now
  title: Code gets produced faster. Judgment doesn't.
  body: AI can generate features, security headers, and tests. You still need to recognize broken trust boundaries, missing authorization, weak assertions, and tests that pass without proving useful behavior.
  takeaway: Dev Academy trains the judgment behind the code - one focused Pill at a time.

